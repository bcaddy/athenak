name: Sync wiki

on:
  push:
    branches: [main-chemistry]
    paths:
      - 'docs/**'
  workflow_dispatch:

env:
  WIKI_SOURCE_DIR: docs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync files
        run: |
          rsync -av --delete --exclude='.git' "main/${WIKI_SOURCE_DIR}/" wiki-repo/

      - name: Commit and push
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Sync wiki from main repo: ${{ github.sha }}"
          git push